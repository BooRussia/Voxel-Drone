<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TESDRIVE</title>
  <meta name="description" content="TesDrive · Dunnellon · Ocala">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23000' width='32' height='32'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/site.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <nav class="hud"><p>PART 107</p></nav>

  <main id="decks">
    <section class="beat" id="deck" data-beat="0">
      <div class="overlay">
        <h1>TESDRIVE</h1>
        <p class="place">DUNNELLON · OCALA</p>
        <a class="book" href="mailto:deadlysinsutube@gmail.com?subject=%5BTesDrive%20inquiry%5D">BOOK</a>
      </div>
    </section>

    <section class="beat" id="climb" data-beat="1">
      <div class="overlay">
        <p class="coord">CLIMB</p>
      </div>
    </section>

    <section class="beat" id="windows" data-beat="2">
      <div class="overlay">
        <p>SITES</p>
        <p>LISTINGS</p>
        <p>EVENTS</p>
      </div>
    </section>

    <section class="beat" id="selected" data-beat="3">
      <div class="overlay overlay-stills">
        <p class="kicker">SELECTED AIR</p>
        <ul class="wells">
          <li>
            <figure class="well"><img alt=""></figure>
            <p>WITHLACOOCHEE <span>2025</span></p>
          </li>
          <li>
            <figure class="well"><img alt=""></figure>
            <p>RAINBOW SPRINGS <span>2024</span></p>
          </li>
          <li>
            <figure class="well"><img alt=""></figure>
            <p>SILVER GLEN <span>2025</span></p>
          </li>
        </ul>
      </div>
    </section>

    <section class="beat" id="how" data-beat="4">
      <div class="overlay">
        <p>PLAN</p>
        <p>FLY</p>
        <p>DELIVER</p>
      </div>
    </section>

    <section class="beat" id="book" data-beat="5">
      <div class="overlay">
        <form id="inquire" action="mailto:deadlysinsutube@gmail.com" method="post" enctype="text/plain">
          <label>NAME
            <input name="name" type="text" autocomplete="name" required>
          </label>
          <label>EMAIL
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <label>WHAT THEY WANT
            <textarea name="want" rows="3" required></textarea>
          </label>
          <label>DATE
            <input name="date" type="date" required>
          </label>
          <button class="ghost" type="submit">SEND</button>
        </form>
      </div>
    </section>
  </main>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
