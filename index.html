<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TESDRIVE</title>
  <meta name="description" content="TesDrive · Dunnellon · Ocala">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23000' width='32' height='32'/%3E%3Ccircle cx='16' cy='16' r='3' fill='none' stroke='%23f0f0fa' stroke-width='1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/site.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <p class="part107">PART 107</p>

  <main id="decks">
    <section class="beat" id="deck" data-beat="0">
      <div class="overlay">
        <h1>TESDRIVE</h1>
        <p class="place">DUNNELLON · OCALA</p>
        <a class="ghost" href="mailto:deadlysinsutube@gmail.com?subject=%5BTesDrive%20inquiry%5D">BOOK</a>
      </div>
    </section>

    <section class="beat" id="climb" data-beat="1">
      <div class="overlay">
        <p class="coord">29.0491 N · 82.4609 W</p>
      </div>
    </section>

    <section class="beat" id="windows" data-beat="2">
      <div class="overlay">
        <ol class="windows">
          <li><span>01</span> SITE</li>
          <li><span>02</span> LISTING</li>
          <li><span>03</span> EVENT</li>
        </ol>
      </div>
    </section>

    <section class="beat" id="selected" data-beat="3">
      <div class="overlay">
        <p class="kicker">SELECTED AIR</p>
        <ul class="stills">
          <li>
            <i></i>
            <b>WITHLACOOCHEE</b>
            <span>2025</span>
          </li>
          <li>
            <i></i>
            <b>RAINBOW SPRINGS</b>
            <span>2024</span>
          </li>
          <li>
            <i></i>
            <b>SILVER GLEN</b>
            <span>2025</span>
          </li>
        </ul>
      </div>
    </section>

    <section class="beat" id="how" data-beat="4">
      <div class="overlay">
        <p class="trio">PLAN · FLY · DELIVER</p>
      </div>
    </section>

    <section class="beat" id="book" data-beat="5">
      <div class="overlay">
        <form id="inquire" action="mailto:deadlysinsutube@gmail.com" method="post" enctype="text/plain">
          <label>NAME
            <input name="name" type="text" autocomplete="name" required>
          </label>
          <label>EMAIL
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <label>WHAT THEY WANT
            <textarea name="want" rows="3" required></textarea>
          </label>
          <label>DATE
            <input name="date" type="date" required>
          </label>
          <button class="ghost" type="submit">SEND</button>
        </form>
      </div>
    </section>
  </main>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
